# Variante: publicar el juego en una subruta de un sitio que ya existe,
# por ejemplo https://mi-servidor.com/esquiva/
# Pegar estos bloques DENTRO del "server { ... }" existente.
# Aquí Node sirve también la página (no hace falta "root").
# Si el sitio no tiene ya un "map $http_upgrade", agregar en el bloque http (p. ej. en conf.d):
#   map $http_upgrade $esquiva_connection { default upgrade; '' close; }

location = /esquiva {
    return 301 /esquiva/;
}

location /esquiva/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $esquiva_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
