# /etc/nginx/snippets/esquiva-api.conf
# Puertas al servidor del juego (Node, servicio systemd "esquiva" en 127.0.0.1:3000).
# Lo incluye /etc/nginx/sites-available/esquiva. Usa $esquiva_connection, definido allí con un map.

# WebSocket del juego: pantalla del profesor y celulares.
location = /ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $esquiva_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Una ronda puede durar minutos: no cortar la conexión (el servidor hace ping cada 20 s).
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# Aviso de que un celular salió de la página (navigator.sendBeacon).
location = /leave {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 4k;
}
