# Ruleta de Asientos detrás de nginx, en un dominio o subdominio propio.
# Copiar a /etc/nginx/sites-available/esquiva y enlazar en sites-enabled
# (o a /etc/nginx/conf.d/esquiva.conf). Cambiar server_name y root.

upstream esquiva_node {
    server 127.0.0.1:3000;
    keepalive 8;
}

map $http_upgrade $esquiva_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name esquiva.ejemplo.com;

    # Página ya compilada (npm run build): nginx la sirve sin pasar por Node.
    root /opt/esquiva/dist;
    index index.html;

    # WebSocket del juego: lo atiende el servidor Node.
    location = /ws {
        proxy_pass http://esquiva_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $esquiva_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Una ronda puede durar varios minutos sin mensajes: no cortar la conexión.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
