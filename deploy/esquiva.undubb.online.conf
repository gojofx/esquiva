# Ruleta de Asientos en esquiva.undubb.online (detrás de Cloudflare).
# Responde igual por 80 y 443, sin redirigir: la redirección a HTTPS la hace
# Cloudflare, así no hay bucles con ninguno de sus modos SSL.

# Conexión para el WebSocket (la usa snippets/esquiva-api.conf).
map $http_upgrade $esquiva_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name esquiva.undubb.online;

    # Certificado de origen (Cloudflare <-> servidor; el público ve el de Cloudflare).
    # La zona no atiende el puerto 80, así que Let's Encrypt no puede validar por HTTP:
    # aquí va el Origin Certificate de Cloudflare o, mientras tanto, uno autofirmado.
    ssl_certificate /etc/ssl/esquiva/origin.pem;
    ssl_certificate_key /etc/ssl/esquiva/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Salida de `npm run build`, no la raíz del repositorio
    root /var/www/html/esquiva/dist;
    index index.html;

    access_log /var/log/nginx/esquiva_access.log;
    error_log  /var/log/nginx/esquiva_error.log;

    include snippets/esquiva-api.conf;

    # Sin caché para index.html: tras cada despliegue el navegador pide los archivos nuevos.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Vite pone un hash en el nombre de estos archivos: se pueden cachear sin límite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
