# Ruleta de Asientos en esquiva.undubb.online (detrás de Cloudflare).
# nginx sirve la página compilada; el WebSocket /ws y /leave van al servicio Node
# (systemd: esquiva) en 127.0.0.1:3000.
# Responde igual por 80 y 443 sin redirigir: la redirección a HTTPS la hace Cloudflare.

map $http_upgrade $esquiva_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name esquiva.undubb.online;

    # Certificado de origen (Cloudflare <-> servidor). Cloudflare presenta su propio certificado al público.
    # /etc/ssl/esquiva/ contiene el certificado de origen de Cloudflare o, mientras tanto, uno autofirmado.
    ssl_certificate /etc/ssl/esquiva/origin.pem;
    ssl_certificate_key /etc/ssl/esquiva/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/esquiva/dist;
    index index.html;

    access_log /var/log/nginx/esquiva_access.log;
    error_log  /var/log/nginx/esquiva_error.log;

    # WebSocket del juego
    location = /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $esquiva_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Aviso de salida de la página (navigator.sendBeacon)
    location = /leave {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4k;
    }

    # Vite pone un hash en el nombre de estos archivos: se pueden cachear sin límite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
